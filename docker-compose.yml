services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: casewatch
      POSTGRES_PASSWORD: casewatch
      POSTGRES_DB: casewatch
    ports:
      - '55437:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U casewatch']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
